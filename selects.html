<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selects</title>
<style>
  :root{
    --bg: transparent;
    --ink: #37352f;
    --muted: #9b9a97;
    --faint: #c4c2bf;
    --line: rgba(55,53,47,0.11);
    --chip: rgba(55,53,47,0.04);
    --sheet: #e7e4e0;
    --frame: #b9b3ad;
    --mark: #c8663c;
    --warn: #c0562f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink: #e4e0da;
      --muted: #8d8880;
      --faint: #5f5b55;
      --line: rgba(228,224,218,0.13);
      --chip: rgba(228,224,218,0.05);
      --sheet: #262321;
      --frame: #514b46;
      --mark: #d4794f;
      --warn: #e0805a;
    }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color:var(--ink); font-size:13px; line-height:1.45;
    padding:14px 14px 12px; -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", Menlo, monospace; font-variant-numeric:tabular-nums; }

  header{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .title{ color:var(--muted); font-size:11.5px; letter-spacing:.04em; }
  .dayof{ color:var(--faint); font-size:10.5px; letter-spacing:.03em; }

  .alert{
    background:var(--chip); border-left:2px solid var(--warn);
    color:var(--warn); font-size:11px; line-height:1.5;
    padding:6px 9px; border-radius:0 2px 2px 0; margin:8px 0 10px;
  }
  .alert[hidden]{ display:none; }

  .totals{ display:flex; align-items:flex-end; gap:11px; margin-bottom:3px; }
  .big{ font-size:26px; line-height:1; }
  .big small{ font-size:11px; color:var(--muted); margin-left:3px; }
  .streak{ color:var(--muted); font-size:11px; padding-bottom:2px; }
  .nudge{ color:var(--mark); font-size:11px; margin-bottom:11px; min-height:16px; }

  .sheet{
    background:var(--sheet); border-radius:3px; padding:8px 9px;
    max-height:176px; overflow-y:auto; margin-bottom:9px; scrollbar-width:thin;
  }
  .sheet::-webkit-scrollbar{ width:3px; }
  .sheet::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }
  .strip{ display:flex; align-items:center; gap:7px; padding:3px 0; }
  .strip + .strip{ border-top:1px solid rgba(128,128,128,.12); }
  .strip .d{ flex:0 0 40px; color:var(--faint); font-size:9px; letter-spacing:.03em; }
  .strip .fs{ flex:1 1 auto; display:flex; flex-wrap:wrap; gap:3px; }
  .strip .c{ flex:0 0 auto; color:var(--faint); font-size:9px; }

  .fr{
    width:21px; height:26px; border-radius:1px; padding:0; border:0;
    background:var(--frame); position:relative; cursor:pointer;
    display:block; animation:pop .22s ease;
  }
  .fr svg{ position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); }
  .fr:hover{ filter:brightness(1.15); }
  @keyframes pop{ from{ transform:scale(.75); opacity:0 } to{ transform:none; opacity:1 } }

  .empty{ color:var(--muted); font-size:11.5px; padding:14px 3px; text-align:center; }

  .read{
    color:var(--muted); font-size:11px; min-height:30px; margin-bottom:9px;
    padding-left:9px; border-left:2px solid var(--mark);
  }
  .read b{ color:var(--ink); font-weight:400; display:block; font-size:12.5px; }
  .read span{ font-size:9.5px; color:var(--faint); }

  .add{ display:flex; gap:6px; align-items:center; margin-bottom:10px; }
  .add input{
    flex:1 1 auto; min-width:0; font:inherit; font-size:12px; color:var(--ink);
    background:transparent; border:0; border-bottom:1px solid var(--line); padding:3px 1px;
  }
  .add input::placeholder{ color:var(--faint); }
  .add input:focus{ outline:none; border-bottom-color:var(--mark); }
  .add button{
    flex:0 0 auto; font:inherit; font-size:11px; color:var(--muted);
    background:var(--chip); border:1px solid var(--line); border-radius:3px;
    padding:3px 9px; cursor:pointer;
  }
  .add button:hover{ border-color:var(--mark); color:var(--mark); }

  .foot{ color:var(--faint); font-size:10px; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
  .foot input[type=date]{
    font:inherit; font-size:10px; color:var(--muted); background:transparent;
    border:0; border-bottom:1px solid var(--line); padding:0 1px; width:98px;
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  .foot input[type=date]:hover, .foot input[type=date]:focus{ border-bottom-color:var(--muted); color:var(--ink); outline:none; }
  .foot button{ font:inherit; font-size:10px; color:var(--faint); background:none; border:0; padding:0; cursor:pointer; }
  .foot button:hover{ color:var(--mark); }
  .stat{ font-size:10px; }
  .stat.ok{ color:var(--faint); }
  .stat.bad{ color:var(--warn); }

  .backup{ margin-top:9px; }
  .backup[hidden]{ display:none; }
  .backup textarea{
    width:100%; height:54px; resize:vertical;
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size:9.5px;
    color:var(--muted); background:var(--chip);
    border:1px solid var(--line); border-radius:2px; padding:5px 6px;
  }
  .backup textarea:focus{ outline:none; border-color:var(--muted); }
  .brow{ display:flex; gap:5px; margin-top:5px; align-items:center; }
  .brow button{
    font:inherit; font-size:10px; color:var(--muted);
    background:var(--chip); border:1px solid var(--line); border-radius:3px;
    padding:2px 8px; cursor:pointer;
  }
  .brow button:hover{ border-color:var(--muted); color:var(--ink); }
  .brow .msg{ font-size:10px; color:var(--mark); }

  :focus-visible{ outline:1.5px solid var(--mark); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="title">✎ selects</div>
  <div class="dayof mono" id="dayof"></div>
</header>

<div class="alert" id="alert" hidden></div>

<div class="totals">
  <div class="big mono"><span id="total">0</span><small>done</small></div>
  <div class="streak mono" id="streak"></div>
</div>
<div class="nudge" id="nudge"></div>

<div class="sheet" id="sheet"></div>
<div class="read" id="read"></div>

<div class="add">
  <input id="entry" placeholder="what did you just finish?" spellcheck="false">
  <button id="go">mark</button>
</div>

<div class="foot mono">
  <span>run ends <input id="end" type="date"></span>
  <span>
    <button id="undo" title="remove the most recent mark">undo last</button>
    &nbsp;·&nbsp;
    <button id="tog">backup</button>
  </span>
  <span class="stat mono" id="stat"></span>
</div>

<div class="backup" id="backup" hidden>
  <textarea id="blob" spellcheck="false" placeholder="your data appears here"></textarea>
  <div class="brow">
    <button id="copy">copy</button>
    <button id="restore">restore from box</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
(function(){
  const KEY = "ashtray.selects.v1";
  const $ = s => document.querySelector(s);

  /* ── does storage actually work here? ───────────────
     a try/catch alone isn't enough: some contexts accept
     the write and silently drop it. so write, read back,
     and compare.                                        */
  const STORAGE = (function(){
    try{
      const k = "__probe_" + Math.random();
      localStorage.setItem(k, "x");
      const ok = localStorage.getItem(k) === "x";
      localStorage.removeItem(k);
      return ok ? "ok" : "silent";
    }catch(e){
      return location.protocol === "file:" ? "file" : "blocked";
    }
  })();

  const NOTES = {
    ok: "",
    file: "this is open as a local file, so the browser won't let it save anything. use the https://ast0124.github.io link instead and it will work.",
    blocked: "this browser is blocking storage for this page, so marks won't survive a reload. opening the widget in its own tab usually fixes it. either way, keep a copy with backup below.",
    silent: "storage here accepts writes but throws them away, so marks won't survive a reload. keep a copy with backup below."
  };

  if(STORAGE !== "ok"){
    const a = $("#alert");
    a.textContent = NOTES[STORAGE];
    a.hidden = false;
  }
  $("#stat").textContent = STORAGE === "ok" ? "saving" : "not saving";
  $("#stat").className = "stat mono " + (STORAGE === "ok" ? "ok" : "bad");

  let memory = null;
  function read(){
    if(memory) return memory;
    if(STORAGE === "ok"){
      try{
        const raw = localStorage.getItem(KEY);
        memory = raw ? JSON.parse(raw) : null;
      }catch(e){ memory = null; }
    }
    if(!memory) memory = { start:"", end:"2026-08-11", items:[] };
    if(!memory.start) memory.start = key(new Date());
    return memory;
  }
  function write(){
    if(STORAGE !== "ok") return;
    try{ localStorage.setItem(KEY, JSON.stringify(memory)); }catch(e){}
  }

  function key(d){
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }
  const label = k => new Date(k + "T12:00:00")
    .toLocaleDateString("en-GB",{ day:"2-digit", month:"short" }).toLowerCase();

  function ring(seed){
    const r = n => { const x = Math.sin(seed * 9301 + n * 49297) * 233280; return x - Math.floor(x); };
    const rot = (r(1)*16 - 8).toFixed(1);
    const rx  = (8.4 + r(2)*1.1).toFixed(2);
    const ry  = (11.2 + r(3)*1.3).toFixed(2);
    const cx  = (12.5 + (r(4)*1.4 - .7)).toFixed(2);
    const cy  = (15 + (r(5)*1.4 - .7)).toFixed(2);
    return `<svg viewBox="0 0 25 30" aria-hidden="true">
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"
        fill="none" stroke="var(--mark)" stroke-width="1.6"
        stroke-linecap="round" opacity=".9"
        transform="rotate(${rot} ${cx} ${cy})"/></svg>`;
  }

  function nudgeFor(n){
    if(n === 0) return "nothing marked today yet. one small thing counts.";
    if(n === 1) return "one down.";
    if(n === 2) return "two. that's momentum.";
    if(n === 3) return "three today. that's a real day of work.";
    if(n <= 5) return "solid. more than it feels like from the inside.";
    return "big day. go and stop working.";
  }

  function add(){
    const v = $("#entry").value.trim();
    if(!v) return;
    read().items.push({ text:v, ts:Date.now() });
    write();
    $("#entry").value = "";
    render(read().items.length - 1);
  }

  function undo(){
    const s = read();
    if(!s.items.length) return;
    s.items.pop(); write(); render();
  }

  function showRead(i){
    const s = read();
    if(!s.items.length){ $("#read").innerHTML = ""; return; }
    const it = s.items[Math.max(0, Math.min(i, s.items.length-1))];
    const when = new Date(it.ts).toLocaleString("en-GB",
      { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }).toLowerCase();
    $("#read").innerHTML = `<b>${esc(it.text)}</b><span class="mono">${when}</span>`;
  }

  function render(focus){
    const s = read(), items = s.items;

    const byDay = {};
    items.forEach((it,i) => {
      const k = key(new Date(it.ts));
      (byDay[k] = byDay[k] || []).push({ ...it, i });
    });
    const days = Object.keys(byDay).sort().reverse();
    const today = key(new Date());
    const todayN = (byDay[today] || []).length;

    $("#total").textContent  = items.length;
    $("#streak").textContent = days.length
      ? days.length + (days.length === 1 ? " day worked" : " days worked") : "";
    $("#nudge").textContent  = nudgeFor(todayN);

    if(s.start && s.end){
      const a = new Date(s.start + "T00:00:00"), b = new Date(s.end + "T00:00:00");
      const now = new Date(); now.setHours(0,0,0,0);
      const total = Math.round((b - a)/864e5) + 1;
      const cur   = Math.round((now - a)/864e5) + 1;
      $("#dayof").textContent = (cur >= 1 && total >= 1)
        ? "day " + Math.min(cur,total) + " / " + total : "";
    }
    $("#end").value = s.end || "";

    const sheet = $("#sheet");
    if(!items.length){
      sheet.innerHTML = `<div class="empty">blank sheet. mark the first thing below.</div>`;
      $("#read").innerHTML = "";
      return;
    }

    sheet.innerHTML = days.map(k => {
      const row = byDay[k].map(x =>
        `<button class="fr" data-i="${x.i}" title="${esc(x.text)}">${ring(x.i+1)}</button>`
      ).join("");
      return `<div class="strip">
        <span class="d mono">${k === today ? "today" : label(k)}</span>
        <span class="fs">${row}</span>
        <span class="c mono">${byDay[k].length}</span>
      </div>`;
    }).join("");

    sheet.querySelectorAll(".fr").forEach(b =>
      b.onclick = () => showRead(+b.dataset.i));

    showRead(focus != null ? focus : items.length - 1);
  }

  function esc(s){
    return s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  }

  function flash(t){
    $("#msg").textContent = t;
    setTimeout(() => { $("#msg").textContent = ""; }, 2200);
  }

  $("#tog").onclick = () => {
    const b = $("#backup");
    b.hidden = !b.hidden;
    if(!b.hidden) $("#blob").value = JSON.stringify(read());
  };

  $("#copy").onclick = () => {
    const el = $("#blob");
    el.value = JSON.stringify(read());
    el.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(el.value)
        .then(() => flash("copied"), () => flash("select the box and copy manually"));
    }else{
      try{ document.execCommand("copy"); flash("copied"); }
      catch(e){ flash("select the box and copy manually"); }
    }
  };

  $("#restore").onclick = () => {
    let parsed;
    try{ parsed = JSON.parse($("#blob").value); }
    catch(e){ return flash("that isn't valid backup text"); }
    if(!parsed || !Array.isArray(parsed.items)) return flash("that isn't a selects backup");
    memory = parsed;
    if(!memory.start) memory.start = key(new Date());
    write(); render();
    flash("restored " + parsed.items.length + " marks");
  };

  $("#go").onclick = add;
  $("#undo").onclick = undo;
  $("#entry").addEventListener("keydown", e => { if(e.key === "Enter") add(); });
  $("#end").addEventListener("change", e => { read().end = e.target.value; write(); render(); });

  write(); render();
})();
</script>
</body>
</html>

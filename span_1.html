<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>span</title>
<style>
  :root{
    --ink:#37352f;
    --muted:#9b9a97;
    --faint:#c4c2bf;
    --line:rgba(55,53,47,0.11);
    --chip:rgba(55,53,47,0.07);
    --gold:#d9a441;
    --field:rgba(55,53,47,0.03);
    --paper:#f7f4ee;
    --paper-ink:#8a857c;
    --shadow:rgba(55,53,47,0.16);
    --sz:84px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e4e0da;
      --muted:#8d8880;
      --faint:#5f5b55;
      --line:rgba(228,224,218,0.13);
      --chip:rgba(228,224,218,0.08);
      --gold:#c99435;
      --field:rgba(228,224,218,0.04);
      --paper:#e6e2da;
      --paper-ink:#7d7871;
      --shadow:rgba(0,0,0,0.4);
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:ui-sans-serif,-apple-system,"Segoe UI","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);font-size:13px;line-height:1.45;
    padding:14px;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums}

  .head{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
  .title{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;flex:1}
  .title b{color:var(--ink);font-weight:400}
  .edit{font-size:11px;color:var(--faint);cursor:pointer;background:none;border:0;
    padding:2px 3px;font-family:inherit;flex:none}
  .edit:hover{color:var(--muted)}
  .edit:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
  .warn{font-size:10px;color:var(--gold);flex:none;display:none}
  .warn.on{display:block}

  .main{display:flex;gap:13px;align-items:flex-start}
  .main.stack{flex-direction:column;gap:12px}
  .shot{flex:none}
  .pol{display:inline-block}
  .pol.on{background:var(--paper);padding:6px 6px 0;border-radius:2px;
    box-shadow:0 1px 4px -1px var(--shadow)}
  .win{width:var(--sz);height:var(--sz);background:var(--chip);overflow:hidden;
    border-radius:3px;position:relative}
  .pol.on .win{border-radius:0}
  .win img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
    transition:opacity 1.6s ease,filter 1.6s ease}
  .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;
    color:var(--faint);text-align:center;padding:6px;line-height:1.5;white-space:pre-line}
  .cap{display:none}
  .pol.on .cap{display:block;font-size:9px;color:var(--paper-ink);text-align:center;
    padding:6px 0 8px;letter-spacing:.1em}

  .info{flex:1;min-width:0;padding-top:1px;width:100%}
  .count{background:none;border:0;padding:0;text-align:left;cursor:pointer;
    color:inherit;font:inherit;display:block;border-radius:3px}
  .count:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
  .n{font-size:29px;letter-spacing:-0.02em;line-height:1;color:var(--ink)}
  .u{font-size:12.5px;color:var(--muted);margin-left:5px}
  .pct{font-size:11.5px;color:var(--faint);margin-top:5px;letter-spacing:.02em}

  .bars{display:flex;gap:2px;height:7px;margin:13px 0 9px}
  .bars i{flex:1;border-radius:1px;background:var(--chip);position:relative;overflow:hidden}
  .bars i::after{content:"";position:absolute;inset:0;background:var(--gold);
    transform:scaleX(var(--d,0));transform-origin:left;
    transition:transform 1.1s cubic-bezier(.2,.7,.25,1)}
  .bars.live i::after{transition:none}

  .foot{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .note{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--faint)}
  .note.hide{display:none}

  .panel{display:none}
  .panel.on{display:block}
  .main.off,.note.off{display:none}
  .panel label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
  .panel .f{margin-bottom:11px}
  input[type=text],input[type=datetime-local],textarea{
    width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;
    padding:7px 8px;color:var(--ink);font-family:inherit;font-size:12.5px;resize:vertical}
  textarea{min-height:62px;line-height:1.6}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .two{display:flex;gap:8px}.two>div{flex:1;min-width:0}

  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chips button{padding:5px 10px;border-radius:4px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit;font-size:11.5px;cursor:pointer}
  .chips button:hover{color:var(--ink)}
  .chips button.on{border-color:var(--gold);color:var(--gold)}

  .drop{border:1px dashed var(--line);border-radius:4px;padding:11px;text-align:center;
    font-size:11.5px;color:var(--faint);cursor:pointer}
  .drop:hover,.drop.hot{border-color:var(--gold);color:var(--muted)}
  .thumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .thumbs div{width:32px;height:32px;border-radius:3px;background-size:cover;
    background-position:center;cursor:pointer;position:relative}
  .thumbs div::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px;opacity:0;border-radius:3px}
  .thumbs div:hover::after{opacity:1}
  .acts{display:flex;gap:7px;margin-top:13px}
  .acts button{flex:1;padding:7px;border-radius:4px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer}
  .acts button:hover{color:var(--ink);border-color:var(--faint)}
  .acts button.p{border-color:var(--gold);color:var(--gold)}
  .tip{font-size:10.5px;color:var(--faint);line-height:1.5;margin-top:7px}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<script>
/* 改这里。也可以用网址参数覆盖，方便同一个文件嵌好几个：
   span.html?title=交片&target=2026-09-01T18:00&prec=m&size=lg&pol=1
   photos 用仓库里的相对路径，手机上才看得到。 */
const CONFIG = {
  title:  "untitled",
  start:  "",            // 空 = 从今天算
  target: "",            // "2026-09-01T18:00"
  photos: [],            // ["img/01.jpg","img/02.jpg"]
  size:   "sm",          // sm | md | lg
  pol:    false,         // 宝丽来边框
  prec:   "h",           // d | h | m | s
  notes:  "今天也算一格。\n卷还在走，不用赶。\n已经有东西在上面了。\n慢慢来，时间是够的。\n前面那些格不会掉。\n这一格正在攒。"
};
</script>

<div class="head">
  <span class="title" id="title">⊹ —</span>
  <span class="warn mono" id="warn">not saving</span>
  <button class="edit" id="edit">⌗</button>
</div>

<div class="main" id="main">
  <div class="shot">
    <div class="pol" id="pol">
      <div class="win" id="win"><span class="ph" id="ph">⌗ 放几张
照片进来</span></div>
      <div class="cap mono" id="cap"></div>
    </div>
  </div>
  <div class="info">
    <button class="count" id="count" title="click to flip">
      <span class="n mono" id="n">—</span><span class="u" id="u"></span>
      <div class="pct" id="pct"></div>
    </button>
    <div class="bars" id="bars"></div>
    <div class="foot mono" id="foot"></div>
  </div>
</div>

<div class="note" id="note"></div>

<div class="panel" id="panel">
  <div class="f"><label>name</label><input type="text" id="fTitle" placeholder="交片 / 布展 / essay"></div>
  <div class="f two">
    <div><label>from</label><input type="datetime-local" id="fStart"></div>
    <div><label>until</label><input type="datetime-local" id="fTarget"></div>
  </div>

  <div class="f">
    <label>photo</label>
    <div class="chips">
      <button data-k="size" data-v="sm">sm</button>
      <button data-k="size" data-v="md">md</button>
      <button data-k="size" data-v="lg">lg</button>
      <button data-k="pol" data-v="toggle">polaroid</button>
    </div>
  </div>

  <div class="f">
    <label>countdown detail</label>
    <div class="chips">
      <button data-k="prec" data-v="d">day</button>
      <button data-k="prec" data-v="h">hr</button>
      <button data-k="prec" data-v="m">min</button>
      <button data-k="prec" data-v="s">sec</button>
    </div>
  </div>

  <div class="f">
    <label>photos</label>
    <div class="drop" id="drop">拖进来，或点这里选</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs"></div>
    <p class="tip">这里传的照片只存在这台设备。手机上也要看到的话，把图放进仓库再写进最上面的 CONFIG.photos。</p>
  </div>

  <div class="f">
    <label>bottom line</label>
    <textarea id="fNotes" placeholder="一行一句，按天轮换。全部删空就不显示这一行。"></textarea>
  </div>

  <div class="acts">
    <button id="cancel">cancel</button>
    <button id="save" class="p">save</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const fmt = d => MON[d.getMonth()] + " " + pad(d.getDate());
const SIZES = { sm:84, md:124, lg:168 };

/* storage probe */
const mem = {}; let SAVES = true;
try{ localStorage.setItem("__p","1"); SAVES = localStorage.getItem("__p")==="1";
     localStorage.removeItem("__p"); }catch(e){ SAVES = false; }
const get = k => { try{ return SAVES ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return null; } };
const set = (k,v) => { try{ if(SAVES){ localStorage.setItem(k,v); return true; } mem[k]=v; return false; }
                       catch(e){ mem[k]=v; return false; } };

let S = {}, D = {}, flip = false, KEY = "span:v1", timer = null, lastSlot = -1;

function localISO(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())
       + "T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fromURL(){
  const q = new URLSearchParams(location.search), o = {};
  ["title","start","target","size","prec"].forEach(k => { if(q.get(k)) o[k] = q.get(k); });
  if(q.get("pol")) o.pol = q.get("pol") === "1";
  if(q.get("photos")) o.photos = q.get("photos").split(",").map(s=>s.trim()).filter(Boolean);
  return o;
}

/* "6d 18h 24m 09s" — trimmed to the chosen precision */
function span(ms, prec){
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24,
        m = Math.floor(ms/6e4)%60, s = Math.floor(ms/1000)%60;
  const out = [d + "d"];
  if(prec !== "d") out.push(h + "h");
  if(prec === "m" || prec === "s") out.push(m + "m");
  if(prec === "s") out.push(pad(s) + "s");
  return out.join(" ");
}

function boot(){
  const u = fromURL();
  KEY = "span:" + ((u.title || CONFIG.title || "default").slice(0,40));
  let saved = {};
  try{ const raw = get(KEY); if(raw) saved = JSON.parse(raw); }catch(e){}
  flip = !!saved.flip;
  S = Object.assign({}, CONFIG, saved, u);
  if(!S.start) S.start = localISO(new Date());
  if(!S.target){ const d = new Date(); d.setDate(d.getDate()+14); d.setHours(18,0,0,0); S.target = localISO(d); }
  if(!SAVES) $("warn").classList.add("on");
  applyLook(); render(); retime();
}
function retime(){
  clearInterval(timer);
  timer = setInterval(render, S.prec === "s" ? 1000 : 30000);
  $("bars").classList.toggle("live", S.prec === "s");
}
function applyLook(){
  document.documentElement.style.setProperty("--sz", (SIZES[S.size] || 84) + "px");
  $("pol").classList.toggle("on", !!S.pol);
  $("main").classList.toggle("stack", S.size === "lg");
}

function render(){
  const start = new Date(S.start), target = new Date(S.target), now = new Date();

  if(isNaN(start) || isNaN(target) || target <= start){
    $("title").innerHTML = "⊹ <b>" + (S.title || "untitled") + "</b>";
    $("n").textContent = "—"; $("u").textContent = ""; $("pct").textContent = "";
    $("foot").textContent = "";
    $("note").classList.remove("hide");
    $("note").textContent = "until 得在 from 之后。点 ⌗ 改一下。";
    return;
  }

  const total   = target - start;
  const elapsed = clamp(now - start, 0, total);
  const remain  = Math.max(0, target - now);
  const pct     = elapsed / total;
  const done    = remain === 0;
  const dEl     = Math.floor(elapsed/864e5);
  const dRe     = Math.floor(remain/864e5);

  $("title").innerHTML = "⊹ <b>" + (S.title || "untitled") + "</b> "
    + '<span style="color:var(--faint)">' + fmt(start) + " → " + fmt(target) + "</span>";

  if(flip){
    $("n").textContent = dRe; $("u").textContent = dRe === 1 ? "day left" : "days left";
    $("pct").textContent = done ? "done" : span(remain, S.prec) + " to go";
    $("foot").textContent = span(elapsed, S.prec) + " in · " + Math.round(pct*100) + "%";
  }else{
    $("n").textContent = dEl; $("u").textContent = dEl === 1 ? "day in" : "days in";
    $("pct").textContent = Math.round(pct*100) + "% through";
    $("foot").textContent = done ? "done" : span(remain, S.prec) + " left · until " + fmt(target);
  }

  const days  = Math.ceil(total/864e5);
  const slots = clamp(days, 6, 16);
  const at    = pct * slots;
  const full  = Math.floor(at);
  const frac  = at - full;

  const bars = $("bars");
  if(bars.childElementCount !== slots){
    bars.innerHTML = "";
    for(let i=0;i<slots;i++) bars.appendChild(document.createElement("i"));
  }
  [...bars.children].forEach((b,i) => {
    b.style.setProperty("--d", done ? 1 : (i < full ? 1 : i === full ? frac.toFixed(4) : 0));
  });

  const pics = S.photos || [];
  const slot = clamp(full, 0, slots-1);
  const win  = $("win");
  if(pics.length){
    $("ph").style.display = "none";
    let img = win.querySelector("img");
    if(!img){ img = new Image(); img.alt = ""; win.appendChild(img); }
    if(slot !== lastSlot){ img.src = pics[slot % pics.length]; lastSlot = slot; }
    const d = done ? 1 : Math.max(frac, .18);
    img.style.opacity = (0.30 + d*0.70).toFixed(2);
    img.style.filter  = "saturate(" + (0.45 + d*0.55).toFixed(2) + ")";
  }else{
    $("ph").style.display = "grid";
  }

  if(S.pol){
    const slotStart = new Date(start.getTime() + (total/slots)*slot);
    $("cap").textContent = fmt(slotStart);
  }

  const lines = (S.notes || "").split("\n").map(s => s.trim()).filter(Boolean);
  const note = $("note");
  if(!lines.length) note.classList.add("hide");
  else{
    note.classList.remove("hide");
    note.textContent = done ? lines[lines.length-1] : lines[dEl % lines.length];
  }
}

$("count").onclick = () => {
  flip = !flip; render();
  let o = {}; try{ o = JSON.parse(get(KEY) || "{}"); }catch(e){}
  o.flip = flip; set(KEY, JSON.stringify(o));
};

function paintChips(){
  document.querySelectorAll(".chips button").forEach(b => {
    const k = b.dataset.k;
    b.classList.toggle("on", k === "pol" ? !!D.pol : D[k] === b.dataset.v);
  });
}
document.querySelectorAll(".chips button").forEach(b => {
  b.onclick = () => {
    if(b.dataset.k === "pol") D.pol = !D.pol;
    else D[b.dataset.k] = b.dataset.v;
    paintChips();
  };
});

$("edit").onclick = () => {
  D = { size:S.size, pol:S.pol, prec:S.prec };
  $("fTitle").value = S.title; $("fStart").value = S.start;
  $("fTarget").value = S.target; $("fNotes").value = S.notes || "";
  paintChips(); drawThumbs();
  $("panel").classList.add("on"); $("main").classList.add("off"); $("note").classList.add("off");
};
function close(){ $("panel").classList.remove("on"); $("main").classList.remove("off");
  $("note").classList.remove("off"); }
$("cancel").onclick = close;

$("save").onclick = () => {
  S.title  = $("fTitle").value.trim() || "untitled";
  S.start  = $("fStart").value;
  S.target = $("fTarget").value;
  S.notes  = $("fNotes").value;
  S.size = D.size; S.pol = D.pol; S.prec = D.prec;
  const ok = set(KEY, JSON.stringify({...S, flip}));
  lastSlot = -1; close(); applyLook(); render(); retime();
  if(!ok){ $("note").classList.remove("hide");
    $("note").textContent = "存不进浏览器，这次改动只在这个页面有效。"; }
};

$("drop").onclick = () => $("file").click();
$("file").onchange = e => addFiles(e.target.files);
["dragover","dragleave","drop"].forEach(ev =>
  $("drop").addEventListener(ev, e => {
    e.preventDefault(); $("drop").classList.toggle("hot", ev === "dragover");
    if(ev === "drop") addFiles(e.dataTransfer.files);
  }));

function addFiles(list){
  [...list].filter(f => f.type.startsWith("image/")).slice(0,10).forEach(f => {
    const r = new FileReader();
    r.onload = () => shrink(r.result).then(d => {
      S.photos = [...(S.photos||[]), d].slice(-10); drawThumbs();
    });
    r.readAsDataURL(f);
  });
}
function shrink(dataURL){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 520, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg", .72));
    };
    img.onerror = () => res(dataURL);
    img.src = dataURL;
  });
}
function drawThumbs(){
  const t = $("thumbs"); t.innerHTML = "";
  (S.photos||[]).forEach((p,i) => {
    const d = document.createElement("div");
    d.style.backgroundImage = "url("+p+")"; d.title = "remove";
    d.onclick = () => { S.photos.splice(i,1); drawThumbs(); };
    t.appendChild(d);
  });
}

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sips</title>
<style>
  :root{
    --bg: transparent;
    --ink: #37352f;
    --muted: #9b9a97;
    --faint: #c4c2bf;
    --line: rgba(55,53,47,0.11);
    --chip: rgba(55,53,47,0.04);
    --strip: #e9e6e1;
    --strip-edge: rgba(55,53,47,0.10);
    --water: #7a94b8;
    --coffee: #6b4f3a;
    --tea: #9a8f5e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink: #e4e0da;
      --muted: #8d8880;
      --faint: #5f5b55;
      --line: rgba(228,224,218,0.13);
      --chip: rgba(228,224,218,0.05);
      --strip: #2a2724;
      --strip-edge: rgba(228,224,218,0.10);
      --water: #6f8cb4;
      --coffee: #b98a63;
      --tea: #b3a76d;
    }
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); }
  body{
    font-family: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); font-size:13px; line-height:1.45;
    padding:14px 14px 12px; -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", Menlo, monospace; font-variant-numeric: tabular-nums; }

  header{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:11px; }
  .title{ color: var(--muted); font-size:11.5px; letter-spacing:.04em; }
  .date{ color: var(--faint); font-size:10.5px; letter-spacing:.03em; }

  /* totals */
  .totals{ display:flex; align-items:flex-end; gap:14px; margin-bottom:9px; }
  .big{ font-size:26px; line-height:.95; letter-spacing:-.01em; }
  .big small{ font-size:11px; color: var(--muted); margin-left:2px; letter-spacing:0; }
  .sub{ color: var(--muted); font-size:11px; padding-bottom:2px; }

  .bar{ height:3px; border-radius:2px; background: var(--chip); overflow:hidden; margin-bottom:4px; }
  .bar i{ display:block; height:100%; background: var(--water); transition: width .35s ease; }
  .bar.caff i{ background: var(--coffee); }
  .barlabel{ display:flex; justify-content:space-between; color: var(--faint); font-size:9.5px; margin-bottom:11px; }

  /* the roll */
  .roll{
    position:relative; background: var(--strip);
    border-radius:2px; padding:9px 7px; margin-bottom:10px;
  }
  .roll::before, .roll::after{
    content:""; position:absolute; left:5px; right:5px; height:3px;
    background-image: repeating-linear-gradient(90deg,
      var(--strip-edge) 0 4px, transparent 4px 9px);
  }
  .roll::before{ top:3px; }
  .roll::after{ bottom:3px; }
  .frames{
    display:flex; gap:3px; overflow-x:auto; padding:1px 0;
    scrollbar-width:none;
  }
  .frames::-webkit-scrollbar{ display:none; }
  .frame{
    flex:0 0 auto; width:24px; height:31px; border-radius:1px;
    position:relative; border:1px solid var(--strip-edge);
    animation: pop .22s ease;
  }
  .frame.water { background: transparent; border-color: var(--water); opacity:.75; }
  .frame.coffee{ background: var(--coffee); border-color: var(--coffee); }
  .frame.tea   { background: var(--tea); border-color: var(--tea); opacity:.8; }
  .frame b{
    position:absolute; left:2px; bottom:1px; font-size:7px; font-weight:400;
    color: var(--ink); opacity:.42;
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  .frame.coffee b, .frame.tea b{ color:#fff; opacity:.6; }
  @keyframes pop{ from{ transform: scale(.8); opacity:0 } to{ transform:none; opacity:1 } }
  .empty{ color: var(--muted); font-size:11px; padding:9px 2px; }

  /* buttons */
  .keys{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
  .keys button{
    font: inherit; font-size:11.5px; color: var(--ink);
    background: var(--chip); border:1px solid var(--line);
    border-radius:3px; padding:4px 9px; cursor:pointer; transition: border-color .15s;
  }
  .keys button:hover{ border-color: var(--muted); }
  .keys button:active{ transform: translateY(.5px); }
  .keys .undo{ margin-left:auto; color: var(--muted); }
  :focus-visible{ outline:1.5px solid var(--water); outline-offset:2px; }

  hr{ border:0; border-top:1px solid var(--line); margin:0 0 9px; }

  /* week */
  .week{ display:flex; gap:3px; align-items:flex-end; height:30px; margin-bottom:5px; }
  .wcol{ flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .wbar{ width:100%; background: var(--chip); border-radius:1px; height:22px; position:relative; }
  .wbar i{ position:absolute; left:0; right:0; bottom:0; background: var(--water); opacity:.65; border-radius:1px; }
  .wdots{ height:4px; display:flex; gap:1.5px; }
  .wdots s{ width:2.5px; height:2.5px; border-radius:50%; background: var(--coffee); display:block; }
  .wdow{ display:flex; gap:3px; color: var(--faint); font-size:9px; margin-bottom:10px; }
  .wdow span{ flex:1 1 0; text-align:center; }

  /* settings */
  .set{ color: var(--faint); font-size:10px; display:flex; flex-wrap:wrap; gap:4px 10px; }
  .set input{
    font: inherit; font-size:10px; color: var(--muted);
    background: transparent; border:0; border-bottom:1px solid var(--line);
    width:32px; text-align:right; padding:0 1px;
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
  }
  .set input:hover, .set input:focus{ border-bottom-color: var(--muted); color: var(--ink); }
  .set input::-webkit-outer-spin-button,
  .set input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .set input[type=number]{ -moz-appearance: textfield; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="title">⊹ today&rsquo;s roll</div>
  <div class="date mono" id="date"></div>
</header>

<div class="totals">
  <div class="big mono"><span id="ml">0</span><small>ml</small></div>
  <div class="sub mono" id="caff">~0mg caffeine</div>
</div>

<div class="bar"><i id="waterBar" style="width:0%"></i></div>
<div class="barlabel mono"><span id="goalLabel">goal 2000ml</span><span id="frameCount">0 frames</span></div>

<div class="roll">
  <div class="frames" id="frames"></div>
</div>

<div class="keys">
  <button data-add="water:250">water +250</button>
  <button data-add="water:500">+500</button>
  <button data-add="coffee">coffee</button>
  <button data-add="tea">tea</button>
  <button class="undo" id="undo" title="remove the last frame">↺ undo</button>
</div>

<hr>
<div class="week" id="week"></div>
<div class="wdow" id="wdow"></div>

<div class="set">
  <span>goal <input type="number" id="sGoal" min="0" step="100">ml</span>
  <span>coffee ≈<input type="number" id="sCoffee" min="0" step="5">mg</span>
  <span>tea ≈<input type="number" id="sTea" min="0" step="5">mg</span>
</div>

<script>
(function(){
  const KEY = "ashtray.sips.v1";
  const $ = s => document.querySelector(s);

  /* ── storage (falls back to memory if blocked) ── */
  let memory = null;
  function read(){
    if(memory) return memory;
    try{
      const raw = localStorage.getItem(KEY);
      memory = raw ? JSON.parse(raw) : null;
    }catch(e){ memory = null; }
    if(!memory) memory = { goal:2000, mgCoffee:80, mgTea:45, days:{} };
    return memory;
  }
  function write(){
    try{ localStorage.setItem(KEY, JSON.stringify(memory)); }catch(e){}
  }

  const dayKey = d => {
    d = d || new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  };

  function entries(k){
    const s = read();
    if(!s.days[k]) s.days[k] = [];
    return s.days[k];
  }

  function prune(){
    const s = read(), cutoff = Date.now() - 40*864e5;
    Object.keys(s.days).forEach(k => {
      if(new Date(k + "T12:00:00").getTime() < cutoff) delete s.days[k];
    });
  }

  /* ── actions ─────────────────────────────────── */
  function add(spec){
    const [type, ml] = spec.split(":");
    entries(dayKey()).push({ t:type, ml: ml ? +ml : 0, ts: Date.now() });
    write(); render(true);
  }
  function undo(){
    const list = entries(dayKey());
    if(list.length){ list.pop(); write(); render(); }
  }

  /* ── render ──────────────────────────────────── */
  function render(scroll){
    const s = read(), list = entries(dayKey());

    const ml = list.reduce((a,e) => a + (e.ml||0), 0);
    const mg = list.reduce((a,e) =>
      a + (e.t === "coffee" ? s.mgCoffee : e.t === "tea" ? s.mgTea : 0), 0);

    $("#date").textContent =
      new Date().toLocaleDateString("en-GB",{ day:"2-digit", month:"short" }).toLowerCase();
    $("#ml").textContent = ml;
    $("#caff").textContent = "~" + mg + "mg caffeine";
    $("#waterBar").style.width = Math.min(100, s.goal ? ml/s.goal*100 : 0) + "%";
    $("#goalLabel").textContent = "goal " + s.goal + "ml";
    $("#frameCount").textContent = list.length + (list.length === 1 ? " frame" : " frames");

    const frames = $("#frames");
    if(!list.length){
      frames.innerHTML = `<div class="empty">empty roll. tap a key below.</div>`;
    }else{
      frames.innerHTML = list.map((e,i) => {
        const time = new Date(e.ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
        const what = e.ml ? e.ml + "ml water" : e.t;
        return `<div class="frame ${e.t}" title="${what} · ${time}"><b>${i+1}</b></div>`;
      }).join("");
      if(scroll) frames.scrollLeft = frames.scrollWidth;
    }

    // last 7 days
    const wk = [], dow = [];
    for(let i=6; i>=0; i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const l = s.days[dayKey(d)] || [];
      const w = l.reduce((a,e) => a + (e.ml||0), 0);
      const c = l.filter(e => e.t === "coffee").length;
      wk.push(`<div class="wcol">
          <div class="wdots">${"<s></s>".repeat(Math.min(c,5))}</div>
          <div class="wbar"><i style="height:${Math.min(100, s.goal ? w/s.goal*100 : 0)}%"></i></div>
        </div>`);
      dow.push(`<span>${d.toLocaleDateString("en-GB",{weekday:"narrow"}).toLowerCase()}</span>`);
    }
    $("#week").innerHTML = wk.join("");
    $("#wdow").innerHTML = dow.join("");

    $("#sGoal").value   = s.goal;
    $("#sCoffee").value = s.mgCoffee;
    $("#sTea").value    = s.mgTea;
  }

  /* ── wiring ──────────────────────────────────── */
  document.querySelectorAll("[data-add]").forEach(b =>
    b.onclick = () => add(b.dataset.add));
  $("#undo").onclick = undo;

  const bind = (id, field) => $(id).onchange = e => {
    const v = parseInt(e.target.value, 10);
    if(!isNaN(v) && v >= 0){ read()[field] = v; write(); }
    render();
  };
  bind("#sGoal", "goal");
  bind("#sCoffee", "mgCoffee");
  bind("#sTea", "mgTea");

  prune(); write(); render();

  // roll over at midnight
  setInterval(() => {
    if($("#date").dataset.k !== dayKey()){ $("#date").dataset.k = dayKey(); render(); }
  }, 60000);
})();
</script>
</body>
</html>
